<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">The four panes of the RStudio window</title>
  <desc id="desc">A diagram of the RStudio interface showing the Source pane at top left, the Console at bottom left, the Environment pane at top right, and the Files, Plots and Help pane at bottom right.</desc>

  <rect x="0" y="0" width="900" height="580" fill="none"/>

  <!-- window frame -->
  <rect x="18" y="18" width="864" height="544" rx="10" fill="#ffffff" stroke="#c8c8d0" stroke-width="1.5"/>
  <path d="M18 28 a10 10 0 0 1 10 -10 h844 a10 10 0 0 1 10 10 v22 h-864 z" fill="#eeeef2"/>
  <circle cx="40" cy="35" r="5.5" fill="#e06c60"/>
  <circle cx="59" cy="35" r="5.5" fill="#e6b24a"/>
  <circle cx="78" cy="35" r="5.5" fill="#7ec36a"/>
  <text x="450" y="40" text-anchor="middle" font-size="13" fill="#55555f">RStudio — ec306.Rproj</text>

  <!-- SOURCE -->
  <rect x="30" y="62" width="418" height="232" rx="6" fill="#fbfbfd" stroke="#d2d2da"/>
  <rect x="30" y="62" width="418" height="26" rx="6" fill="#eaeaf0"/>
  <rect x="30" y="80" width="418" height="8" fill="#eaeaf0"/>
  <text x="44" y="80" font-size="12" fill="#44444e">assignment1.qmd</text>
  <text x="330" y="80" font-size="11.5" fill="#9e32a8" font-weight="600">▶ Render</text>
  <g font-size="12.5" fill="#3a3a44" font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="44" y="112">library(tidyverse)</text>
    <text x="44" y="133">lfs &lt;- read_csv("ec306lfs.csv")</text>
    <text x="44" y="163">lfs |&gt;</text>
    <text x="44" y="184">  group_by(educ) |&gt;</text>
    <text x="44" y="205">  summarise(mean_wage = mean(wage))</text>
    <text x="44" y="235">ggplot(lfs, aes(x = wage)) +</text>
    <text x="44" y="256">  geom_histogram()</text>
  </g>
  <circle cx="416" cy="106" r="15" fill="#9e32a8"/>
  <text x="416" y="111" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>

  <!-- CONSOLE -->
  <rect x="30" y="306" width="418" height="242" rx="6" fill="#fbfbfd" stroke="#d2d2da"/>
  <rect x="30" y="306" width="418" height="26" rx="6" fill="#eaeaf0"/>
  <rect x="30" y="324" width="418" height="8" fill="#eaeaf0"/>
  <text x="44" y="324" font-size="12" fill="#44444e">Console</text>
  <g font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="44" y="356" fill="#7a7a86">R version 4.6.0</text>
    <text x="44" y="382" fill="#3a3a44">&gt; mean(lfs$wage)</text>
    <text x="44" y="403" fill="#7a7a86">[1] 25.87</text>
    <text x="44" y="429" fill="#3a3a44">&gt; </text>
    <rect x="56" y="419" width="8" height="14" fill="#3a3a44"/>
  </g>
  <circle cx="416" cy="350" r="15" fill="#9e32a8"/>
  <text x="416" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>

  <!-- ENVIRONMENT -->
  <rect x="460" y="62" width="410" height="232" rx="6" fill="#fbfbfd" stroke="#d2d2da"/>
  <rect x="460" y="62" width="410" height="26" rx="6" fill="#eaeaf0"/>
  <rect x="460" y="80" width="410" height="8" fill="#eaeaf0"/>
  <text x="474" y="80" font-size="12" fill="#44444e">Environment</text>
  <text x="566" y="80" font-size="12" fill="#8a8a96">History</text>
  <g font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#3a3a44">
    <text x="474" y="116">Data</text>
    <text x="490" y="139">lfs</text>
    <text x="600" y="139" fill="#7a7a86">500 obs. of 7 variables</text>
    <text x="490" y="162">workers</text>
    <text x="600" y="162" fill="#7a7a86">5 obs. of 4 variables</text>
    <text x="474" y="192">Values</text>
    <text x="490" y="215">earnings</text>
    <text x="600" y="215" fill="#7a7a86">num [1:5]</text>
    <text x="490" y="238">n</text>
    <text x="600" y="238" fill="#7a7a86">500</text>
  </g>
  <line x1="474" y1="124" x2="856" y2="124" stroke="#e2e2e8"/>
  <line x1="474" y1="200" x2="856" y2="200" stroke="#e2e2e8"/>
  <circle cx="838" cy="106" r="15" fill="#9e32a8"/>
  <text x="838" y="111" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>

  <!-- FILES / PLOTS -->
  <rect x="460" y="306" width="410" height="242" rx="6" fill="#fbfbfd" stroke="#d2d2da"/>
  <rect x="460" y="306" width="410" height="26" rx="6" fill="#eaeaf0"/>
  <rect x="460" y="324" width="410" height="8" fill="#eaeaf0"/>
  <text x="474" y="324" font-size="12" fill="#8a8a96">Files</text>
  <text x="512" y="324" font-size="12" fill="#44444e" font-weight="600">Plots</text>
  <text x="556" y="324" font-size="12" fill="#8a8a96">Packages</text>
  <text x="622" y="324" font-size="12" fill="#8a8a96">Help</text>
  <!-- mini histogram -->
  <g fill="#9e32a8" opacity="0.75">
    <rect x="520" y="470" width="26" height="30"/>
    <rect x="550" y="440" width="26" height="60"/>
    <rect x="580" y="404" width="26" height="96"/>
    <rect x="610" y="392" width="26" height="108"/>
    <rect x="640" y="420" width="26" height="80"/>
    <rect x="670" y="452" width="26" height="48"/>
    <rect x="700" y="478" width="26" height="22"/>
  </g>
  <line x1="510" y1="500" x2="740" y2="500" stroke="#8a8a96"/>
  <line x1="510" y1="380" x2="510" y2="500" stroke="#8a8a96"/>
  <text x="625" y="522" text-anchor="middle" font-size="11.5" fill="#7a7a86">Hourly wage ($)</text>
  <circle cx="838" cy="350" r="15" fill="#9e32a8"/>
  <text x="838" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
</svg>
